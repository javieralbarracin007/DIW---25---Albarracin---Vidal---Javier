<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            display: grid;
            gap: 1px;
            grid-template-columns: repeat(3, 150px);
            text-align: center;
        }
        .container div{
            background-color: grey;
            color: white;
        }
        .header{
            grid-column-start: 1;
            grid-column-end: 4;
        }
        .left{
            grid-row-start: 2;
            grid-row-end: 4;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">celda 1</div>
        <div class="left">celda 2</div>
        <div>celda 3</div>
        <div>celda 4</div>
        <div>celda 5</div>
        <div>celda 6</div>
    </div>
</body>
</html>
