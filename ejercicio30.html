<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 20px;
            font-family: Arial, sans-serif;
        }
        button {
            width: 100px;
            height: 45px;            
            border: none;
            border-radius: 50px;
            position: relative; /* Added for badge positioning */
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            cursor: pointer;
        }
        .button--principal::after {
            content: "4";
            background-color: red;
            border-radius: 50%;
            height: 18px;
            width: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: absolute;
            top: -5px;
            right: -5px;
            font-size: 11px;
            color: white;
            font-weight: bold;
        }
        
        #button--primary {
            background-color: rgb(0, 174, 255);
            color: white;
        }
        #button--secondary {
            background-color: gray;
            color: white;
        }
        #button--success {
            background-color: green;
            color: white;
        }
        #button--danger {
            background-color: red;
            color: white;
        }
        #button--warning {
            background-color: yellow;
            color: black;
        }
        #button--info {
            background-color: rgb(26, 167, 214);
            color: white;
        }
        #button--light {
            background-color: rgba(201, 201, 201, 0.767);
            color: black;
        }
        #button--dark {
            background-color: black;
            color: white;
        }


    </style>
</head>
<body>
    <button class="button--principal" id="button--primary">Primary</button>
    <button class="button--principal" id="button--secondary">Secondary</button>
    <button class="button--principal" id="button--success">Success</button>
    <button class="button--principal" id="button--danger">Danger</button>
    <button class="button--principal" id="button--warning">Warning</button>
    <button class="button--principal" id="button--info">Info</button>
    <button class="button--principal" id="button--light">Light</button>
    <button class="button--principal" id="button--dark">Dark</button>
</body>
</html>
