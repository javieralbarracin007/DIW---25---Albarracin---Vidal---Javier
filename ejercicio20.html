<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #bt1 {
            background-color:rgb(118, 194, 56);
            color: hsl(0, 0%, 100%);
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        #bt1:hover {
            background-color: rgb(0, 150, 136);
        }
        #bt2 {
            background-image: url( https://placehold.co/100x50);
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            border: none;
            cursor: pointer;
        }
        #bt3 {
            background: linear-gradient(45deg, rgba(207, 122, 96, 0.9), hsla(14, 94%, 51%, 0.8));
            padding: 10px 20px;
            color : white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <button id="bt1">Boton 1</button>
    <button id="bt2">Boton 2</button>
    <button id="bt3">Boton 3</button>
</body>
</html>
