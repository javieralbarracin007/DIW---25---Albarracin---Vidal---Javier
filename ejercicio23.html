<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1 {
            text-align: center;
            font-family: Arial, Helvetica, sans-serif;
            text-transform: uppercase;
        }
        h2 {
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            font-size: 24px;
            font-style: italic;
        }
        p{
            font-family: 'Times New Roman', Times, serif;
            font-size: 18px;
            text-align: justify;
            line-height: 1.5;
        }
        cite {
            font-style: italic;
            border-left: 3px solid gray;
            margin-left: 20px;
        }
        a {
            color: rgb(25, 91, 212);
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h1>Titulo Blog</h1>
    <h2>Subtitulo Blog</h2>
    <p>Este es un parrafo de ejemplo para el blog. Aquí se puede escribir contenido interesante y relevante para los lectores.</p>
    <blockquote>
        <cite>Este es un ejemplo de cita</cite>
    </blockquote>
    <a href="">Link</a>
</body>
</html>
