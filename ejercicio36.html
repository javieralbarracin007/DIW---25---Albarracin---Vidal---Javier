<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        header{
            width: 100%;
            height: 80px;
            background-color: #333;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .logo{
            color: white;
            font-size: 24px;
            line-height: 80px;
            padding-left: 20px;
        }
        nav.menu{
            line-height: 80px;
        }
        nav.menu a{
            color: white;
            text-decoration: none;
            padding: 0 15px;
        }
        nav.menu a:hover{
            background-color: #555;
        }
    </style>
</head>
<body>
    <!-- Enunciado:
     Desarrolla una barra de navegación horizontal utilizando Flexbox que
    cumpla con los siguientes requisitos:
     Estructura:
     La barra de navegación debe contener un logotipo y un menú con 
    enlaces.
     El logotipo debe estar alineado a la izquierda.
     El menú debe estar alineado a la derecha y sus elementos deben 
    estar distribuidos
    horizontalmente.
     Estilos:
     La barra debe tener un fondo de color oscuro y los enlaces deben 
    ser de color claro.
     Al pasar el cursor sobre los enlaces, el color de fondo debe cambiar.
    25-->
    <header>
        <div class="logo">Logo</div>
        <nav class="menu">
            <a href="">Home</a>
            <a href="">About</a>
            <a href="">Contact</a>
        </nav>
    </header>
</body>
</html>
