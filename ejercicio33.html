<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #caja1, #caja2, #caja3 {
            width: 200px;
            height: 200px;
            position: absolute;

        }
        #caja1 {
            background-color: red;
            top: 50px;
            left: 50px;
            z-index: 1;
        }
        #caja2 {
            background-color: green;
            top: 100px;
            left: 100px;
            z-index: 2;
        }
        #caja3 {
            background-color: blue;
            top: 150px;
            left: 150px;
            z-index: 3;
        }
    </style>
</head>
<body>
    <!-- Enunciado:
    Crea tres cajas apiladas cn diferentes colores y 
    usa z-index para controlar cual esta encima -->
    <div id="caja1"></div>
    <div id="caja2"></div>
    <div id="caja3"></div>
</body>
</html>
