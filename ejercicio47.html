<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            display: grid;
            gap: 1px;
            height: 150px;
            grid-template-columns: repeat(4, 150px);
            justify-content: center;
            text-align: center;
        }
        .header{
            grid-column: 1/4;
        }
        .sidebar{
            grid-column:4/4;
            grid-row:1/3;
        }
        .container div{
            background-color: grey;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">celda 1</div>
        <div class="sidebar">celda2</div>
        <div>celda3</div>
        <div>celda4</div>
        <div>celda5</div>
    </div>
</body>
</html>
