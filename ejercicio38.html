<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            padding: 0;
            margin: 0;
        }
        .contenedor{
            height: 100vh;
            background-color: bisque;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .contenedor img{
            width: 200px;
        }
    </style>
</head>
<body>
    <!--Utilizando Flexbox, centra un elemento tanto horizontal como
verticalmente dentro de un contenedor que cumpla con los siguientes
requisitos:
 Estructura:
 Un contenedor que ocupa toda la ventana del navegador.
 Un elemento interno, como un texto o imagen.
 Estilos:
 El contenedor debe tener un color de fondo.
 El elemento interno debe ser centrado sin utilizar márgenes o posicionamiento
absoluto.
27-->
    <div class="contenedor">
        <img src="/src/perfil.jpg" alt="">
    </div>
</body>
</html>
