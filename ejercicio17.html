<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #tarjeta {
            width: 400px;
            border: 2px solid rgb(000, 000, 000);
            margin: auto;
            background-color: hsl(200, 50%, 80%);
            }
        h1 {
            font-size: 20pt;
            color: rgb(50, 50, 50);
        }
        p {
            font-size: 12pt;
            color: rgb(80, 80, 80);
        }
        img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            display: block;
            margin: auto;
        }
        input {
            background-color: rgba(0, 0, 255, 0.5);
            color: hsla(240, 100%, 50%, 1);
        }
        input:hover {
            background-color: rgba(160, 160, 160, 0.8);
        }
    </style>
</head>
<body>
    <div id="tarjeta">
        <img src="src/perfil.jpg" alt="">
        <div>
            <h1>Nombre del usuario</h1>
            <p>Descripción del usuario</p>
        </div>
        <input type="button" value="Contacto">
    </div>
</body>
</html>
