<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        a {
            font-family: sans-serif;
            font-size: 16px;
            word-spacing: 15px;
            text-transform: uppercase;
            font-variant: small-caps;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
        a:active {
            font-weight: 900;
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <a href="">Inicio</a>
            <a href="">Servicios</a>
            <a href="">Productos</a>
            <a href="">Contacto</a>
        </nav>
    </header>
</body>
</html>
