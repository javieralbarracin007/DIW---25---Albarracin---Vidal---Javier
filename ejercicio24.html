<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio24</title>
    <style>
        div {
            width: 300px;
            height: 500px;
            overflow: hidden;
            border-radius: 20px;
            background-color: var(--primary-color);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        div:hover {
            background-color: var(--secondary-color);
        }

        img {
            width: 100%;
            height: auto;
            border-radius: 50%;
        }

        h3, p, button {
            text-align: center;
            margin: 10px 0;
            font-family: Arial, sans-serif;
            color: var(--text-color);
            margin: var(--espacio-base) 0;
        }
        button {
            background-color: var(--secondary-color);
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
        }
        h3::before {
            content: "Nombre: ";
            font-weight: bold;
        }
        p::first-letter {
            font-size: 1.5em;
            font-weight: bold;
        }
        button:active {
            background-color: var(--primary-color);
        }
        button::after {
            content: " +";
        }
        :root {
            --primary-color: #4CAF50;
            --text-color: #FFFFFF;
            --secondary-color: #2ecc71;
            --background-color: #ecf0f1;
            --espacio-base: 16px;
        }
    </style>
</head>
<body>
    <div>
        <img src="src/perfil.jpg" alt="">
        <h3>Javier Perez</h3>
        <p>Desarrollador Web apasionado por la tecnologia y el codigo abierto</p>
        <button>Seguir</button>
    </div>
</body>
</html>
